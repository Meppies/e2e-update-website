name: Update site

on:
  schedule:
    - cron: "41 4 * * *" # once a day, 04:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/agenda.json", "site/ratings.json", "site/favs/**", "site/events/**", "data/**", ".github/keepalive"]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  update:
    # Issues only matter when they are a rating or a favourites list.
    if: github.event_name != 'issues' || github.event.issue.title == 'Session rating' || github.event.issue.title == 'Favourites' || contains(github.event.issue.labels.*.name, 'rating') || contains(github.event.issue.labels.*.name, 'favourites')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Also freezes an event in site/events/ the day after it ended.
      # A failed scrape keeps the last good copy and does not stop the votes below.
      - name: Scrape e2emvc.com
        if: github.event_name != 'issues'
        continue-on-error: true
        run: go run ./cmd/scrape -prev site/agenda.json -out site/agenda.json -events site/events

      - name: Count ratings and save favourites
        env:
          VOTE_KEY: ${{ secrets.VOTE_KEY }}
          VOTE_HMAC: ${{ secrets.VOTE_HMAC }}
        run: |
          gh issue list -R "$REPO" --state open --limit 1000 --json number,author,body,title,labels > "$RUNNER_TEMP/issues.json"
          # Averages are published on the daily, manual and push runs only, not right after a vote.
          publish=true; [ "${{ github.event_name }}" = "issues" ] && publish=false
          go run ./cmd/votes -publish=$publish -issues "$RUNNER_TEMP/issues.json" -actions "$RUNNER_TEMP/actions.json"

      # GitHub switches off schedules after 60 days without a commit.
      - name: Keep the daily schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then date -u +%FT%TZ > .github/keepalive; fi

      - name: Commit
        id: commit
        run: |
          git add -A site
          for p in data .github/keepalive; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Site data updated ($(date -u +%F' '%H:%M) UTC)"
          for attempt in 1 2 3; do
            if git push -q; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull -q --rebase -X theirs
            sleep $((attempt * 3))
          done
          exit 1

      # Only after the votes are safely committed: answer and close each issue.
      - name: Answer the issues
        run: |
          jq -c '.[]' "$RUNNER_TEMP/actions.json" | while read -r a; do
            n=$(jq -r .number <<<"$a")
            gh issue comment "$n" -R "$REPO" --body "$(jq -r .comment <<<"$a")" || true
            gh issue close "$n" -R "$REPO" --reason "$(jq -r .reason <<<"$a")" || true
            gh issue lock "$n" -R "$REPO" --reason resolved 2>/dev/null || true
          done

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
