name: Save my favourites
description: Used by "Sync" on e2emvc.meppie.eu to take your starred sessions to another device.
title: "Favourites"
labels: ["favourites"]
body:
  - type: markdown
    attributes:
      value: |
        Your starred sessions are filled in below: just press **Create** / **Submit new issue**.
        A bot saves them within a minute or two. On another device, tap **Sync** on the site and enter your GitHub name.
        The list is public, like everything in this repository.
  - type: textarea
    id: favourites
    attributes:
      label: Favourites
      description: One session id per line.
    validations:
      required: true
