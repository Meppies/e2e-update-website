name: Rate a session
description: Used by the stars on e2emvc.meppie.eu. Your vote is encrypted; only averages are shown.
title: "Session rating"
labels: ["rating"]
body:
  - type: markdown
    attributes:
      value: |
        Everything is filled in already: just press **Create** / **Submit new issue**.
        Your vote (session and stars) is encrypted, so nobody can read it here. A bot counts it within a minute or two and closes this issue.
        The site only shows averages, once a session has 3 votes, updated once a day. One vote per GitHub account per session; your latest vote counts.
  - type: textarea
    id: vote
    attributes:
      label: Vote
      description: Encrypted by the site. Please do not change it.
    validations:
      required: true
